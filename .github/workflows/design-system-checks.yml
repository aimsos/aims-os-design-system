name: Design system checks

on:
  # Every pull request, not only the ones targeting main. Stacked PRs point at
  # an intermediate branch, so `branches: [main]` silently skipped them: #70 and
  # #71 (5,000+ lines between them) ran no type check and no audit at all, and
  # still reported CLEAN because only the Vercel check was present.
  #
  # `closed` is in the list only so the preview cleanup can fire — it is not a
  # default type, and without it a merged PR's preview would sit on gh-pages
  # for ever. `checks` skips that event explicitly; there is nothing to type
  # check about a PR that is over.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Token audit (hardcoded values, orphaned components)
        run: npm run audit:tokens

      # Checks 6-8 (DS-component shadows, variant="main" overuse, hand-rolled
      # cards) are warnings, so the step above prints them and still exits 0.
      # That is deliberate — none of the three can ever be required to hit zero,
      # each has a real false-positive mode — but it meant PR #55 shipped 4
      # shadow and 6 main-overuse findings straight past a green CI.
      #
      # The ratchet lives in scripts/audit-ratchet.cjs rather than inline here,
      # because .husky/pre-push runs the exact same script. The rule that stops
      # a push locally is then the same rule that fails CI, so nobody discovers
      # a new constraint only after pushing.
      #
      # `github.base_ref` — compare against the PR's OWN base, not always main.
      # A stacked PR (#70 → feat/voice-channel) would otherwise inherit every
      # finding its base already carries and fail for work it did not do.
      - name: No new DS warnings vs base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          node scripts/audit-ratchet.cjs FETCH_HEAD

  # ── Publish the GitHub Pages site ─────────────────────────────────────────
  # The site used to be published by hand, with `npm run deploy` from a laptop.
  # Two problems, both real rather than theoretical:
  #
  #   1. `gh-pages -d dist` publishes the WORKING TREE, not main. Running it
  #      while on a feature branch puts unmerged work on the official site and
  #      nothing warns you. On 2026-09-09 that was one command away from
  #      happening.
  #   2. It only runs when someone remembers. The site sat a full day behind
  #      main with six merged PRs of drift, which turns "is this live yet?"
  #      into a question the team has to ask.
  #
  # So the site now follows main, and only main. `needs: checks` is the gate:
  # a red main does not publish. The review gate moves from "before deploy" to
  # "before merge". Preview URLs for PRs are not published here (GitHub Pages
  # only serves main); use the Actions check + a local `npm run dev` for review.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never let two deploys race for the branch. Queue instead of cancelling —
    # the last push must be the one that ends up live.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # GH_PAGES=true is what sets Vite's base to /aims-os-design-system/.
      # This is a SECOND build on purpose: the checks job builds for Vercel,
      # which serves from the domain root, so its output has the wrong base
      # path and cannot be reused here.
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GH_PAGES: "true"

      # PLAIN GIT, NOT `npx gh-pages` — changed when per-PR previews arrived.
      #
      # The CLI wipes the branch on every publish, and previews live on that
      # same branch under preview/. One deploy from main would have deleted
      # every open PR's preview, silently, and the links in those PR comments
      # would 404 until someone pushed again. The CLI has no way to say "clear
      # everything except this folder".
      #
      # So the branch is checked out and rewritten explicitly: delete
      # everything at the root EXCEPT .git and preview/, copy dist in, commit.
      # Twelve lines that say exactly what they do, and they also retire the
      # `--user` trap the old note below documents — there is no RFC address
      # matcher here to fall foul of.
      - name: Publish to gh-pages
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "$REPO_URL" .gh-pages || {
            git init .gh-pages
            git -C .gh-pages checkout -b gh-pages
            git -C .gh-pages remote add origin "$REPO_URL"
          }
          # Everything at the root goes except .git and the previews.
          find .gh-pages -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name preview -exec rm -rf {} +
          cp -R dist/. .gh-pages/
          # Pages would otherwise run the output through Jekyll, which drops
          # any directory starting with an underscore.
          touch .gh-pages/.nojekyll
          cd .gh-pages
          git config user.name  "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy ${GITHUB_SHA:0:7} from main"
          git push origin gh-pages

  # ── Per-PR preview ────────────────────────────────────────────────────────
  #
  # WHY THIS EXISTS. The repo moved to the AIMS OS org on 2026-09-11 and Vercel
  # did not come with it, which took the per-PR preview URL with it. That URL
  # was not a convenience: it was the only way to look at a change before it
  # was published, and the only way to show one to somebody who does not have
  # the repo cloned. Without it the order inverts — merge, publish, then find
  # out — on a repo whose entire content is prototypes waiting to be reviewed.
  #
  # WHY NOT JUST RECONNECT VERCEL. That needs an app installed on the
  # organisation, which is an owner's decision and an outside dependency. This
  # needs nothing but the repo: same Pages site, same token, a subfolder per
  # PR. It is less capable than Vercel — no instant rollbacks, no per-commit
  # history — and it answers the one question that matters.
  #
  # Gated on `checks` so a preview is never built from something that does not
  # compile, and sharing the `gh-pages` concurrency group with `deploy` so the
  # two never race for the branch.
  preview:
    needs: checks
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # BASE_PATH has to match where this lands exactly, or every asset
      # resolves against the domain root and the page loads blank.
      - name: Build for the preview path
        env:
          BASE_PATH: /aims-os-design-system/preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Publish the preview
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "$REPO_URL" .gh-pages
          rm -rf ".gh-pages/preview/pr-$PR"
          mkdir -p ".gh-pages/preview/pr-$PR"
          cp -R dist/. ".gh-pages/preview/pr-$PR/"
          cd .gh-pages
          git config user.name  "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Preview for PR #$PR (${GITHUB_SHA:0:7})"
          git push origin gh-pages

      # ONE comment, edited on every push, never a new one each time. A PR with
      # nine identical preview comments is a PR nobody reads the comments of.
      - name: Comment the link
        uses: actions/github-script@v7
        with:
          script: |
            const pr  = context.issue.number
            const url = `https://aimsos.github.io/aims-os-design-system/preview/pr-${pr}/`
            const tag = '<!-- pr-preview -->'
            const body = [
              tag,
              `### Preview`,
              ``,
              `**${url}**`,
              ``,
              `Built from \`${context.sha.slice(0, 7)}\`. Updates on every push to this PR, and is removed when it closes.`,
              ``,
              `A prototype opens at \`?proto=<id>\` — e.g. [UCP Contacts](${url}?proto=proto-thomas-ucp-contacts).`,
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr, per_page: 100,
            })
            const existing = comments.find(c => c.body?.startsWith(tag))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body })
            }

  # ── Cleanup ───────────────────────────────────────────────────────────────
  #
  # A closed PR's preview is a link that outlives the thing it previewed, and
  # gh-pages would grow a folder per PR for ever. Runs on close whether the PR
  # was merged or abandoned — both mean nobody should still be looking at it.
  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Remove the preview
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "$REPO_URL" .gh-pages
          rm -rf ".gh-pages/preview/pr-$PR"
          cd .gh-pages
          git config user.name  "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Remove preview for PR #$PR"
          git push origin gh-pages
